<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兵のモデル確認</title>
<style>
  body { margin: 0; background: #cfdde6; font: 14px sans-serif; overflow: hidden; }
  #ui { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 16px); }
  button { padding: 6px 10px; border: 1px solid #556; background: #fff; border-radius: 4px; cursor: pointer; }
  button.on { background: #2f5a96; color: #fff; }
  #msg { position: absolute; left: 8px; bottom: 8px; color: #223; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="msg">読み込み中…</div>
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script src="../js/lib/BufferGeometryUtils.js"></script>
<script src="../js/lib/GLTFLoader.js"></script>
<script src="../js/soldier3d.js"></script>
<script>
// 1.6.65 兵のモデル・動き・武器・馬を並べて見る確認用ページ（ゲームには使わない）
// 左から t1（竹槍）・t2（槍）・t3（弓）・t4（鉄砲）・t4（刀）、奥は馬に乗った t4
const T = THREE, S3 = SGK.SOLD3D; S3.PATH = '../assets/models/';
const rd = new T.WebGLRenderer({ antialias: true }); rd.setPixelRatio(Math.min(2, devicePixelRatio)); rd.shadowMap.enabled = true;
document.body.appendChild(rd.domElement);
const scene = new T.Scene(); scene.background = new T.Color(0xcfdde6);
const cam = new T.PerspectiveCamera(40, 1, 0.1, 200);
scene.add(new T.HemisphereLight(0xd6e6f5, 0x4f5a34, 0.72));
const sun = new T.DirectionalLight(0xffe6c0, 1.0); sun.position.set(-6, 12, 8); sun.castShadow = true; scene.add(sun);
const gr = new T.Mesh(new T.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new T.MeshLambertMaterial({ color: 0x6d7c44 })); gr.receiveShadow = true; scene.add(gr);
const CL = ['idle', 'walk', 'run', 'spear', 'sword', 'bow', 'gun', 'hit', 'die', 'ride'];
let clip = 'idle', yaw = 0.5, pitch = 0.25, dist = 9;
const ui = document.getElementById('ui');
for (const c of CL) { const b = document.createElement('button'); b.textContent = c; b.onclick = () => { clip = c; for (const x of ui.children) x.classList.toggle('on', x === b); }; if (c === clip) b.classList.add('on'); ui.appendChild(b); }
let drag = null; addEventListener('pointerdown', (e) => { if (e.target === rd.domElement) drag = [e.clientX, e.clientY]; }); addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.008; pitch = Math.min(1.4, Math.max(-0.2, pitch + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; });
addEventListener('wheel', (e) => { dist = Math.min(40, Math.max(2, dist * (e.deltaY > 0 ? 1.1 : 0.9))); });
const LINE = [[1, 'takeyari', 'spear'], [2, 'yari', 'spear'], [3, 'yumi', 'bow'], [4, 'teppo_t4', 'gun'], [4, 'katana', 'sword']];
const M = new T.Matrix4(), Mh = new T.Matrix4(), Mw = new T.Matrix4();
S3.load(T, scene, 50, () => { document.getElementById('msg').textContent = 'ドラッグで回す・ホイールで寄る'; });
window.S3 = S3; window.setView = (y, p, d) => { yaw = y; pitch = p; dist = d; };
const t0 = performance.now();
function frame() {
  requestAnimationFrame(frame);
  const w = innerWidth, h = innerHeight; if (rd.domElement.width !== Math.floor(w * rd.getPixelRatio())) { rd.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, 1 + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist); cam.lookAt(0, 1, 0);
  if (S3.ready) {
    const t = (performance.now() - t0) / 1000;
    S3.begin();
    LINE.forEach(([tr, wn, kind], i) => {
      const b = S3.tiers[tr - 1];
      M.makeTranslation((i - 2) * 1.4, 0, 0);
      const row = S3.rowAt(b, clip, t, clip !== 'die' && clip !== 'ride');
      S3.put(b, M, row, 0);
      Mw.multiplyMatrices(M, S3.weapon(b, row, kind, clip, Mh)); S3.putW(wn, Mw);
    });
    const hb = S3.horses.white; M.makeTranslation(0, 0, -3.5).multiply(new T.Matrix4().makeScale(S3.hk, S3.hk, S3.hk));
    S3.put(hb, M, S3.rowAt(hb, clip === 'run' ? 'gallop' : clip === 'walk' ? 'walk' : 'idle', t, true), 0);
    const b4 = S3.tiers[3]; M.makeTranslation(0, S3.seat - b4.hipSit, -3.5); S3.put(b4, M, S3.rowAt(b4, 'ride', 0, false), 0);
    S3.end();
  }
  rd.render(scene, cam);
}
frame();
</script>
</body>
</html>
