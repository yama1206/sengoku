<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>戦国思想録</title>
<style>
:root{--ink:#f3e9d2;--gold:#d4a94a;--panel:#211b16;--line:#3d3228}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#2e2218,#0e0b09 70%);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;-webkit-tap-highlight-color:transparent;user-select:none;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:8px 8px 40px}
button{font-family:inherit;color:var(--ink);background:#3a2b1f;border:1px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:15px}
button:disabled{opacity:.35}
button.big{width:100%;padding:14px;font-size:18px;margin:8px 0;background:#5a3a1c}
.ver{position:fixed;top:8px;left:8px;font-size:12px;display:flex;gap:6px;align-items:center;z-index:5}
.ver button{padding:4px 10px;font-size:12px}
.title{text-align:center;padding-top:80px}
.title h1{font-size:38px;letter-spacing:6px;color:var(--gold);margin:10px 0 4px;text-shadow:0 0 18px #a5701e}
.title p{opacity:.7;margin:0 0 30px}
.ideos{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.ic{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);text-align:left}
.ic.on{border-color:var(--c);box-shadow:0 0 12px var(--c)}
.ic .k{font-size:30px;color:var(--c);width:40px;text-align:center}
.ic small{display:block;opacity:.7}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:4px}
.top button{padding:4px 10px;font-size:13px}
.zone{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:6px}
.pinfo{font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.md{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid #000a}
.md.t{opacity:.25}
.row{display:flex;gap:5px;flex-wrap:wrap;min-height:6px;margin:3px 0}
.face{width:100%;padding:8px;margin:3px 0;font-size:14px;background:#2b2118}
.face.hl{border-color:#ff7a4a;box-shadow:0 0 10px #ff7a4a;background:#5a2a1a}
.u{width:calc((100% - 20px)/5);min-width:58px;min-height:68px;border:2px solid var(--c);border-radius:8px;padding:3px;background:#2d241c;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.u b{font-size:11px;line-height:1.15}
.u i{font-style:normal;font-size:14px;color:var(--c);font-weight:bold}
.u s{text-decoration:none;font-size:10px;opacity:.85;min-height:12px}
.u.tap{opacity:.5;transform:rotate(8deg)}
.u.sel{box-shadow:0 0 0 2px #fff,0 0 12px var(--c)}
.u.tg{box-shadow:0 0 0 3px #ffe14a;animation:bl 1s infinite}
.u.tg2{box-shadow:0 0 0 3px #ff7a4a}
@keyframes bl{50%{opacity:.6}}
.fc{font-size:11px;border:1px solid var(--c);color:var(--c);border-radius:12px;padding:2px 8px}
.log{font-size:12px;height:78px;overflow-y:auto;background:#0008;border-radius:8px;padding:5px 8px;margin-bottom:6px;line-height:1.5}
.detail{font-size:12px;min-height:54px;background:#0006;border-radius:8px;padding:6px 8px;margin:4px 0;line-height:1.5}
.dim{opacity:.5}
.acts{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap}
.acts .msg{font-size:13px;color:#ffe14a;flex:1}
.hand{display:flex;flex-wrap:wrap;gap:5px}
.hc{width:calc((100% - 20px)/5);min-width:58px;height:88px;border:2px solid var(--c);border-radius:8px;background:#2d241c;position:relative;padding:3px;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;opacity:.55}
.hc.ok{opacity:1}
.hc.sel{transform:translateY(-6px);box-shadow:0 0 0 2px #fff,0 0 12px var(--c);opacity:1}
.hc em{position:absolute;top:-1px;left:-1px;background:var(--c);color:#111;font-style:normal;font-weight:bold;width:20px;height:20px;border-radius:7px 0 7px 0;font-size:12px;line-height:20px}
.hc b{font-size:11px;line-height:1.15;margin-bottom:2px}
.hc span{font-size:10px;opacity:.85}
.hc small{position:absolute;top:2px;right:4px;color:var(--c);font-size:12px}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mb{background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto;font-size:14px;line-height:1.6}
.mb button{display:block;width:100%;margin-top:8px}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px;filter:brightness(.72);z-index:0;pointer-events:none}
.u,.hc{overflow:hidden}
.u>*,.hc>*{z-index:1;text-shadow:0 1px 3px #000,0 0 4px #000}
.u>.art,.hc>.art{z-index:0}
.u{position:relative}
.dart{float:left;width:48px;height:64px;object-fit:cover;border-radius:6px;margin-right:8px}
.lr{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line);padding:6px 0;font-size:12px;line-height:1.5}
.lr img{width:48px;height:64px;object-fit:cover;border-radius:6px;background:#0006;flex:none}
.lr .ph{width:48px;height:64px;border-radius:6px;border:2px solid var(--c);flex:none}
.lr code{font-size:11px;color:var(--gold)}
.sc{display:inline-block;margin:3px 4px 3px 0;padding:6px 12px;border:2px solid var(--line);border-radius:16px;font-size:13px}
.sc.on{border-color:var(--gold);color:var(--gold)}
.er{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);border-left:4px solid var(--c);padding:6px 4px}
.er .cb{width:26px;height:26px;border-radius:7px;background:var(--c);color:#111;font-weight:bold;text-align:center;line-height:26px;flex:none;font-size:13px}
.er .tx{flex:1;font-size:11px;line-height:1.4}.er .tx b{font-size:13px}
.ctr{display:flex;align-items:center;gap:4px;flex:none}.ctr button{width:36px;height:36px;padding:0;font-size:18px}.ctr span{width:34px;text-align:center;font-size:13px}
.okc{color:#7be07b}.ngc{color:#ff7a4a}.msg2{font-size:12px;color:#ffb74a;min-height:16px}
.coinb{font-size:12px;border:1px solid var(--gold);border-radius:12px;padding:2px 10px;color:var(--gold);margin-left:4px}
.pcard{display:flex;align-items:center;gap:10px;border:2px solid var(--c);border-radius:12px;padding:10px;margin:8px 0;background:var(--panel)}
.pcard .pcl{flex:1}.pcard button{flex:none;padding:10px 14px;background:#5a3a1c}
.th{position:relative;width:42px;height:56px;border:2px solid var(--c);border-radius:6px;overflow:hidden;background:linear-gradient(160deg,var(--c),#111);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff6}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.unown{opacity:.45}
.rt{font-size:10px;font-weight:bold;border-radius:4px;padding:1px 5px;background:#555;color:#fff}
.rt-N{color:#bbb}.rt-R{color:#9fd3ff}.rt-SR{color:#ffd84a}.rt-SSR{background:linear-gradient(90deg,#ff6b6b,#ffd86b,#6bff9a,#6bc8ff,#c86bff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.packov{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#2a1f3a,#07050a 75%);z-index:30;display:flex;padding:12px;overflow:auto}
.pkbadge{position:fixed;left:12px;top:12px;z-index:35;background:#000a;border:1px solid var(--gold);color:var(--gold);border-radius:14px;padding:4px 14px;font-size:15px;font-weight:bold;letter-spacing:1px}
.mgrid{display:grid;grid-template-columns:repeat(5,62px);gap:14px 10px;margin:6px 0 20px;position:relative}
.mpk{position:relative;width:62px;height:94px;border-radius:8px;background:linear-gradient(160deg,var(--c),#222 85%);border:2px solid #fff8;box-shadow:0 4px 12px #000a;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;text-align:center;line-height:1.3;letter-spacing:1px}
.mpk .mt{position:absolute;left:-2px;right:-2px;top:-2px;height:14px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#fff8,var(--c));border:2px solid #fff8;border-bottom:2px dashed #fff}
.mpk.torn .mt{animation:mtorn .6s forwards}
.mpk.torn{animation:mpop .5s forwards}
.mpk.g-R.torn{--gl:#9fd3ff}.mpk.g-SR.torn{--gl:#ffd84a}.mpk.g-SSR.torn{--gl:#ff7ad9}
@keyframes mtorn{to{transform:translate(26px,-54px) rotate(38deg);opacity:0}}
@keyframes mpop{0%{transform:scale(1)}40%{transform:scale(1.18);box-shadow:0 0 22px 6px var(--gl,#fff3)}100%{transform:scale(1.05);box-shadow:0 0 16px 4px var(--gl,#0000)}}
.mflash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
.mflash.on{animation:mfl .7s forwards}
@keyframes mfl{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}
.pkin{margin:auto;display:flex;flex-direction:column;align-items:center}
.pk-title{font-size:18px;color:var(--gold);margin-bottom:14px;letter-spacing:2px}.pk-hint{margin:14px 0 8px;opacity:.7;font-size:13px}
.pack{position:relative;width:210px;height:310px}
.packtop{position:relative;height:40px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#fff6,var(--c));border:2px solid #fff8;border-bottom:2px dashed #fff;cursor:grab;touch-action:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tearfill{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,#fff0,#fff);box-shadow:0 0 14px #fff}
.tearhint{position:relative;font-size:12px;color:#222;font-weight:bold;animation:bl 1.2s infinite;pointer-events:none}
.packbody{height:270px;background:linear-gradient(160deg,var(--c),#222 85%);border:2px solid #fff8;border-top:none;border-radius:0 0 12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:0 10px 40px #000a}
.plogo{font-size:22px;letter-spacing:4px;color:#fff;text-shadow:0 0 10px #000}.pname{font-size:18px;color:#fff;text-align:center;line-height:1.5}
.burst{position:absolute;left:50%;top:20px;width:10px;height:10px;border-radius:50%;opacity:0;background:radial-gradient(#fff,#fff0 70%)}
.pack.torn .packtop{animation:torn .85s forwards}
.pack.torn .burst{animation:burst .85s forwards}
@keyframes torn{to{transform:translate(90px,-140px) rotate(35deg);opacity:0}}
@keyframes burst{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,0) scale(60)}}
.stage{position:relative;width:260px;height:392px;touch-action:none}
.stk{position:absolute;left:10px;top:6px;width:240px;height:336px;transform-origin:50% 0;will-change:transform}
.cardwrap{width:240px;height:336px;perspective:1000px;cursor:pointer;animation:cin .35s}
@keyframes cin{from{transform:translateX(120px);opacity:0}to{transform:none;opacity:1}}
.cflip{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.cflip.on{transform:rotateY(180deg)}
.cback,.cfront{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cfront{transform:rotateY(180deg)}
.cback{border-radius:14px;border:4px solid var(--gold);background:radial-gradient(circle at 50% 40%,#4a3a1c,#14100a);display:flex;align-items:center;justify-content:center;font-size:110px;color:var(--gold);text-shadow:0 0 24px #a5701e}
.cf{width:240px;height:336px;border-radius:14px;border:4px solid var(--c);background:#1d1712;position:relative;overflow:hidden;color:#f3e9d2;display:flex;flex-direction:column}
.cfa{height:54%;background:linear-gradient(160deg,var(--c),#111);position:relative;display:flex;align-items:center;justify-content:center;font-size:96px;color:#fff3}
.cfa .art{filter:none;border-radius:0;object-position:50% 14%} /* 縦長の絵なので頭が切れないよう上寄せ */
.cf.t-c .cfa .art,.cf.t-w .cfa .art,.cf.t-x .cfa .art{object-position:50% 40%}
.smw{cursor:pointer}
.bigov{position:fixed;inset:0;background:#000e;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px;box-sizing:border-box}
.bigov img{max-width:92vw;max-height:76vh;border:4px solid var(--c);border-radius:14px;object-fit:contain;background:#111;box-shadow:0 0 24px #000}
.backfix{position:fixed;top:8px;right:8px;z-index:90;padding:6px 16px;font-size:14px;background:#5a1f1f;box-shadow:0 2px 8px #000a}
.bigov .bd{max-width:min(92vw,420px);font-size:13px;line-height:1.6;text-align:left;opacity:.9}
.bigov .bn{font-size:18px;color:#f3e9d2;font-weight:bold}.bigov .bh{font-size:12px;opacity:.7}
.cft{display:flex;gap:6px;align-items:center;padding:6px 8px;font-size:15px}
.cfc{background:var(--c);color:#111;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-weight:bold;flex:none}
.cfi{padding:0 8px;font-size:12px;opacity:.8}.cfd{padding:4px 8px;font-size:11px;line-height:1.45;flex:1;overflow:hidden}
.cfr{position:absolute;right:10px;bottom:6px;font-size:18px;font-weight:bold;letter-spacing:1px}
.cfn{position:absolute;left:0;top:10px;background:#e0524f;color:#fff;font-size:12px;padding:2px 10px;border-radius:0 10px 10px 0;z-index:2}
.foil{position:absolute;inset:0;pointer-events:none}
.r-R .foil{background:linear-gradient(120deg,transparent 30%,#fff5 50%,transparent 70%);background-size:300% 100%;animation:shine 2.6s infinite}
.r-R{border-color:#bfe3ff}
.r-SR{border-color:#ffd84a;box-shadow:0 0 22px 4px #ffd84a99}
.r-SR .foil{background:linear-gradient(120deg,transparent 30%,#ffe9a088 50%,transparent 70%);background-size:300% 100%;animation:shine 2s infinite}
.r-SSR{border-color:#fff;animation:ssrg 1.4s infinite alternate}
.r-SSR .foil{background:linear-gradient(115deg,#ff6b6b55,#ffd86b55,#6bff9a55,#6bc8ff55,#c86bff55,#ff6b6b55);background-size:400% 100%;animation:shine 3s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-150% 0}}
@keyframes ssrg{from{box-shadow:0 0 22px 6px #ff6bc8}to{box-shadow:0 0 30px 10px #6bc8ff}}
.fx{position:absolute;inset:-30px;pointer-events:none;overflow:visible;animation:fxo 2.2s forwards}
@keyframes fxo{0%,70%{opacity:1}100%{opacity:0}}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0;animation:spk 1.4s infinite;box-shadow:0 0 8px currentColor}
@keyframes spk{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:translateY(-30px) scale(.3)}}
.rtext{position:absolute;left:0;right:0;top:-8px;text-align:center;font-size:34px;font-weight:bold;color:#ffe27a;text-shadow:0 0 12px #ff9a00;animation:rpop .6s}
.fx-SSR .rtext{background:linear-gradient(90deg,#ff6b6b,#ffd86b,#6bff9a,#6bc8ff,#c86bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:44px;filter:drop-shadow(0 0 10px #fff)}
@keyframes rpop{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.flash{position:fixed;inset:0;background:#fff;pointer-events:none;animation:fl .9s forwards;z-index:40}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.sumgrid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px;margin-bottom:14px}
.smw{width:101px;height:142px}.smi{transform:scale(.42);transform-origin:top left;width:240px;height:336px}
.smi .cfd{display:none}.smi .cfa{height:62%}
.res{font-size:44px;text-align:center;color:var(--gold);margin:6px 0}
/* ===== 2.106.7 天下往来風の見た目：遊戯屋の店の絵を背景に、町の画面と同じ色・枠・ボタン・看板娘の立ち絵と吹き出し ===== */
:root{--ink:#efe6cc;--gold:#f2c14e;--panel:rgba(24,20,15,.88);--line:#8a7448}
html,body{background:#14110d}
body{background:none;font-family:"Hiragino Sans","Yu Gothic UI",sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(20,17,13,.45),rgba(20,17,13,.8)),url(../assets/town/shop.jpg) center/cover no-repeat}
body[data-scr=game]::before{background:linear-gradient(rgba(20,17,13,.72),rgba(20,17,13,.9)),url(../assets/town/shop.jpg) center/cover no-repeat}
h1,h2,h3,.title h1,.ehead b,.pk-title,.res,.wname{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
#app{padding:8px 10px 56px}
#app>div:not(.ov):not(.bigov):not(.packov):not(.ver):not(.tstage){background:var(--panel);border:1px solid var(--line);border-radius:6px;padding-left:12px;padding-right:12px;padding-bottom:12px;margin-top:6px}
button{background:#2b241a;border:1px solid var(--line);border-radius:6px;color:var(--ink);cursor:pointer}
button:hover:not(:disabled){background:#4a3c24;border-color:var(--gold);color:#fff;outline:2px solid var(--gold)}
button.big{background:#2b241a;border:1px solid var(--line);font-size:17px;padding:12px;margin:5px 0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.15em}
button.big.main{background:#6b5428;border-color:var(--gold)}
.sc{border:1px solid var(--line);border-radius:6px;background:#2b241a;padding:5px 11px;cursor:pointer}
.sc.on{background:#6b5428;border-color:var(--gold);color:#fff}
.zone{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.log,.detail{background:rgba(0,0,0,.45);border:1px solid #4a3d27;border-radius:6px}
.mb{background:rgba(24,20,15,.96);border:1px solid var(--gold);border-radius:6px}
.pcard{background:rgba(24,20,15,.7);border-radius:6px}
.er,.lr{border-bottom:1px solid #4a3d27}
.backfix{background:rgba(40,28,16,.92);border:2px solid #c9a35a;color:#f6e7c4;font-weight:bold}
.gpf{outline:3px solid #ffe27a!important;outline-offset:2px;box-shadow:0 0 14px #ffe27acc!important}
.ver{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 2px 2px 8px}
.top{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;margin-right:80px}
.title{padding-top:0}.title h1{font-size:34px;letter-spacing:.2em;text-shadow:0 3px 0 #000;margin:8px 0 2px}
/* 町の絵の場面（看板娘と吹き出し） */
.tstage{position:relative;height:230px;margin:40px -10px 0;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:url(../assets/town/shop.jpg) center/cover no-repeat}
.tstage .who{position:absolute;right:4%;top:7%;height:125%;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.tstage .say{position:absolute;left:4%;bottom:12px;max-width:56%;background:rgba(250,244,228,.94);color:#2b2117;border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tstage .say b{color:#8a3b1c;display:block;font-size:12px}
.whead{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-bottom:6px}
.wname{font-size:22px;color:var(--gold);letter-spacing:.1em}
/* 2.106.13 兵糧の札を見せる・対戦の記録は左下のボタンで開く */
.mrow{align-items:center;gap:3px}.mlab{font-size:11px;opacity:.75;margin-right:2px}
.mc{font-size:10px;line-height:1.2;max-width:5.5em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--c);border-left:4px solid var(--c);border-radius:4px;padding:2px 4px;background:rgba(0,0,0,.35);cursor:pointer}
.mc.t{opacity:.45;background:rgba(0,0,0,.6);transform:rotate(-6deg)}.mc.t::after{content:"横";margin-left:2px;font-size:9px;color:#ffb74a}
.logbtn{position:fixed;left:8px;bottom:8px;z-index:15;padding:6px 12px;font-size:13px;opacity:.9}
.logpop{position:fixed;left:8px;bottom:50px;z-index:16;width:min(340px,calc(100vw - 70px));background:rgba(24,20,15,.96);border:1px solid var(--line);border-radius:6px;padding:4px;box-shadow:0 4px 14px #000a}
.logpop .log{height:auto;max-height:38vh;margin:0;border:none}
/* 2.106.14 札の裏（城門・山札） */
.sb{display:inline-block;flex:none;width:28px;height:40px;border-radius:4px;border:1px solid #c9a35a;

<script>
const VERSION='0.51';
let TEST=false;
const sleep=ms=>TEST?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const IDEO={
 so:{n:'創',c:'#e0b341',who:'織田信長・豊臣秀吉',d:'札引き・武器が得意。新しい力で手数を稼ぐ'},
 gi:{n:'義',c:'#4a8fe7',who:'上杉謙信',d:'守りと城門が得意。堅く守って粘り勝つ'},
 bu:{n:'武',c:'#e0524f',who:'武田信玄',d:'突撃と高い兵力。力で押し切る'},
 bo:{n:'謀',c:'#a477e0',who:'毛利元就・竹中半兵衛',d:'妨害と奇策。相手の動きを崩す'},
 ni:{n:'耐',c:'#4cae6a',who:'徳川家康',d:'兵糧を増やし、耐えて後半に勝つ'},
 ne:{n:'汎',c:'#9aa0a6',who:'足軽・兵士',d:'どの思想の陣立てにも入れられる共通札(思想の数に数えない・どの兵糧でも出せる)'}
};
const TL={u:'武将',w:'武器',p:'姫',c:'城',x:'戦術'};
const KW={rush:'突',guard:'守',double:'連'};
const KWN={rush:'突撃(登場した手番から攻撃できる)',guard:'守(相手が城門や味方の武将を攻撃した時、代わりに戦える。コスト5以下は攻撃できない)',double:'連破(城門を2枚破る)',ambush:'奇襲(城門が破られた時、無料で発動するか手札に加えて温存するかを選べる)'};
// ===== 札定義 =====
// シリーズ単位で定義する。札IDは「シリーズID_思想_連番」で自動採番(例: base_so_01)。
// 画像は img/札ID.png を置くと自動で表示される(無ければ色枠だけ)。個別指定は {img:'パス'}。
// 札データは家ごとに houses/家ID.js に置く(下の defineHouse / HOUSE_FILES)。新しい家は houses/xxx.js を作り、HOUSE_FILES の末尾に足す。新シリーズ(包み)は defineSeries で足す。
// (後から読み込む追加シリーズは series/xxx.js に defineSeries('set2','第2弾',mk=>{ mk(...); }); と書き、SERIES_FILES に足す方法もある)
// 初期札(base)はガチャ対象外。ガチャで出る版は、時代別シリーズ({era:'..'}付き)の札だけ。種類ごとの版は下の表(武将=SR、姫と大名=SR/SSR、城と戦術=R、武器=N。大名は個別に pr:['SR','SSR'] を付ける)。
const PRINTS_ADD={u:['SR'],p:['SR','SSR'],c:['R'],w:['N'],x:['R']};
const SERIES=[],CARDS=[];
const availIdeos=()=>Object.keys(IDEO).filter(k=>k!=='ne'&&CARDS.filter(c=>c.i===k).length>=12);
const SERIES_FILES=[]; // 例: ['series/set2.js']
function defineSeries(id,name,fn,opts){
 const s=Object.assign({id,name,cards:[]},opts||{});SERIES.push(s);
 if(fn)addCards(s,fn);
}
// 札を足す。札IDは「シリーズID_思想_連番」で、連番はシリーズ・思想ごとに足した順につく(順番を変えるとIDがずれて、持っている札や陣立てが壊れる)。house を渡すと札に h(家ID)が付く
const CARD_SEQ={};
function addCards(s,fn,house){
 fn((i,t,n,c,p,cp,o)=>{const q=s.id+'_'+i;CARD_SEQ[q]=(CARD_SEQ[q]||0)+1;
  const card=Object.assign({id:`${s.id}_${i}_${String(CARD_SEQ[q]).padStart(2,'0')}`,series:s.id,i,t,n,c,p,cp,k:[],e:[]},o||{});
  if(house)card.h=house;
  if(t==='x'&&!card.k.includes('ambush'))card.k.push('ambush');
  if(!card.pr)card.pr=s.id==='base'?[]:(PRINTS_ADD[t]||['N']).slice();
  s.cards.push(card);CARDS.push(card);});
}
// 家ごとの札データは houses/家ID.js に置く。defineHouse(家ID, シリーズID, {家の情報}, mk=>{ mk(...); })。家の効果などは、この {家の情報} に足していく
const HOUSES={};
function seriesOf(id){const s=SERIES.find(x=>x.id===id);if(!s)throw new Error('シリーズ未定義: '+id);return s;}
function defineHouse(id,series,info,fn){HOUSES[id]=Object.assign({id,series},info||{});addCards(seriesOf(series),fn,id);}
function addCommonCards(series,fn){addCards(seriesOf(series),fn,null);}
const baseImg=c=>c.img||`img/${c.id}.png`;
// 版(レアリティ)ごとの画像: 初期札のNは ID.png、それ以外は ID_sr.png のように置く。無ければ ID.png、それも無ければ色枠のみ
const printImg=(c,r)=>(c.series==='base'&&r==='N')?baseImg(c):`img/${c.id}_${r.toLowerCase()}.png`;
const imgPath=c=>printImg(c,displayRarity(c));
function imgFb(el,fb){if(el.dataset.f||el.getAttribute('src')===fb){el.remove();}else{el.dataset.f=1;el.src=fb;}}
const artTag=(c,r)=>`<img class="art" src="${printImg(c,r||displayRarity(c))}" onerror="imgFb(this,'${baseImg(c)}')" draggable="false" alt="">`;

defineSeries('e1560','1560年代 桶狭間と関東',null,{era:'1560年代 桶狭間と関東'});
defineSeries('e1560w','1560年代 中国・九州',null,{era:'1560年代 中国・九州'});
defineSeries('e1560e','1560年代 四国・奥羽・北陸',null,{era:'1560年代 四国・奥羽・北陸'});
// 家の札データを読み込む(順番どおりに同期で読む)。順番は札IDの連番に効くので変えない。新しい家は末尾に足す
const HOUSE_FILES=['oda','uesugi','takeda','hojo','imagawa','matsudaira','_common','mouri','amago','otomo','shimazu','ryuzoji','chosokabe','miyoshi','kono','date','ashina','mogami','asakura','nanbu','hatakeyama'];
HOUSE_FILES.forEach(f=>document.write(`<script src="houses/${f}.js?v=${VERSION}"><\/script>`));
</script>
<script>

// ===== 初陣組(無料で1回だけ受け取れる。受け取ると、その札が手に入り陣立てに設定される) =====
const STARTERS=[
 {id:'st_oda',name:'織田家の初陣組',sub:'桶狭間の奇襲で一気に攻める',series:'e1560',house:'oda'},

 {id:'st_matsudaira',name:'松平家の初陣組',sub:'耐えて兵糧を貯め、後半に勝つ',series:'e1560',house:'matsudaira'},
 {id:'st_uesugi',name:'上杉家の初陣組',sub:'守りを固めて関東管領へ',series:'e1560',house:'uesugi'},
 {id:'st_takeda',name:'武田家の初陣組',sub:'突撃で城門を破り続ける',series:'e1560',house:'takeda'},

 {id:'st_otomo',name:'大友家の初陣組',sub:'南蛮の力で手数を稼ぐ',series:'e1560w',house:'otomo'},

 {id:'st_ryuzoji',name:'龍造寺家の初陣組',sub:'耐えて兵糧を貯め、肥前を握る',series:'e1560w',house:'ryuzoji'},

 {id:'st_miyoshi',name:'三好家の初陣組',sub:'大軍で止められずに押し切る',series:'e1560e',house:'miyoshi'},

 {id:'st_mogami',name:'佐竹家の初陣組',sub:'守りを固め、城門を補充する',series:'e1560e',house:'mogami'},
 {id:'st_asakura',name:'朝倉家の初陣組',sub:'一乗谷の富で兵糧を増やす',series:'e1560e',house:'asakura'},
 {id:'st_nanbu',name:'南部家の初陣組',sub:'騎馬の突撃と九戸の剛力',series:'e1560e',house:'nanbu'},
 {id:'st_hatakeyama',name:'能登畠山家の初陣組',sub:'七尾の堅城と、倒れても残る備え',series:'e1560e',house:'hatakeyama'}
];
// ===== CPU対戦(初陣組ごとに「普通」「強い」。それぞれ初めて勝つと戦銭がもらえる) =====
// 普通…そのままの陣立て。強い…相手は手札+1・城門+1・最初から兵糧1枚(数字を変えれば強さを調整できる)
const CPU_LV={n:{name:'普通',hand:0,shield:0,mana:0},s:{name:'強い',hand:1,shield:1,mana:1}};
const CPU_FIRST_SEN=10; // 初めて勝った時の戦銭(家×強さごとに1回)
// 追加札の解放に必要な初陣組。普通でも強いでも、1回勝てば数える
const cpuReq=()=>STARTERS.filter(st=>st.series!=='e1560e');
const cpuDone=(st,lv)=>!!(SV.cpu&&SV.cpu[st.id+':'+lv]);
const cpuCleared=st=>cpuDone(st,'n')||cpuDone(st,'s');
const cpuClearCount=()=>cpuReq().filter(cpuCleared).length;
const expansionLocked=()=>cpuClearCount()<cpuReq().length;
let cpuSel=null,cpuMsg=''; // cpuSel={id,lv}: いま戦っている相手
// 全家から、異なる初陣組を2家まで受け取れる
const FREE_STARTER_LIMIT=2;
const freeStarterRemaining=()=>FREE_STARTER_LIMIT-STARTERS.filter(st=>SV.starters[st.id]).length;
function starterDeck(st){
 const d={};
 for(const c of CARDS.filter(c=>c.series===st.series&&c.h===st.house))d[c.id]=MAX_COPY;
 return d;
}
// 持っている札で初陣組そのままの陣立てが組めるか(陣立てで選べるお手本)
const canBuildStarter=st=>{const d=starterDeck(st);const ks=Object.keys(d);return ks.length>0&&ks.every(k=>{const c=cardById(k);return c&&ownedOf(c)>=d[k];});};
function claimStarter(id){
 const st=STARTERS.find(x=>x.id===id);if(!st||SV.starters[id]||freeStarterRemaining()<=0)return false;
 const d=starterDeck(st);
 for(const k in d){const c=cardById(k);if(c.series==='base')continue;const r0=c.pr[0],key=printKey(c,r0);const cur=SV.prints[key]||0,add=Math.min(d[k],MAX_COPY-cur);SV.prints[key]=cur+Math.max(0,add);if(d[k]>add)SV.pt+=GACHA.dismantle[r0]*(d[k]-Math.max(0,add));} // 3枚を超える分は自動で分解
 SV.starters[id]=1;myDeck=d;saveSave();return true;
}

 draw:e=>`山札から${e.n}枚引く`,ramp:e=>`山札の上${e.n}枚を兵糧にする`,shield:e=>`山札の上${e.n}枚を城門に加える`,
 tapE:()=>'相手の武将1体を横にする',killAll:e=>`兵力${e.max}以下の相手の武将をすべて破壊`,kill:e=>`相手の${e.tapped?'横向きの':''}武将1体を破壊`+(e.max?`(兵力${e.max}以下)`:''),
 bounce:()=>'相手の武将1体を手札に戻す',discard:e=>`相手の手札を無作為に${e.n}枚捨てさせる`,
 breakS:e=>`相手の城門を${e.n}枚破る`,tapAll:()=>'相手の武将すべてを横にする',

};

 guardAll:'味方の武将すべてに守を与える',rampStart:'自分の手番の始め、山札の上を兵糧にする',shieldStart:'自分の手番の始め、山札の上を1枚城門にする',graveStart:'自分の手番の始め、墓地から無作為に1枚を手札に戻す',

 rushDraw:'味方の突撃を持つ武将が城門を破ったとき、1枚引く(1手番に1回)',atkAura:'味方の武将が攻撃している間、兵力+1000',

function desc(c){
 const a=[];
 c.k.forEach(k=>a.push('【'+KWN[k]+'】'));
 if(c.blockBonus)a.push(`守として戦うとき、兵力+${c.blockBonus}。`);
 if(c.surviveShield)a.push('戦闘で生き残り、自分の城門が1枚以下なら山札の上を城門に加える。');
 if(c.blockedBonus)a.push(`守に止められたとき、兵力+${c.blockedBonus}。`);
 if(c.wdisc)a.push('場にいる間、自分の武器の費えが1下がる(最低1)。');
 if(c.killBreak)a.push('自分の手番中、戦闘で相手の武将を破壊したとき、相手の城門を1枚破る(1手番に1回)。');
 if(c.attackUnitBonus)a.push(`自分の手番中、相手の武将を攻撃するとき兵力+${c.attackUnitBonus}。`);
 if(c.deathRamp)a.push('戦闘で破壊されたとき、山札の上を兵糧にする。');

function autoDeck(idl,all){

function packRarity(rolled,available){
 const i=RORD.indexOf(rolled);
 return RORD.slice(0,i+1).reverse().find(r=>available.includes(r))
  ||RORD.slice(i+1).find(r=>available.includes(r));
}
function packRates(available,min){
 const eligible=RORD.slice(min?RORD.indexOf(min):0);
 const total=eligible.reduce((sum,r)=>sum+GACHA.rates[r],0);
 const rates=Object.fromEntries(RORD.map(r=>[r,0]));
 for(const r of eligible)rates[packRarity(r,available)]+=GACHA.rates[r]/total*100;
 return rates;
}
function pullPack(pack){
 const pool=packPrints(pack);
 if(!pool.length)return [];
 const available=[...new Set(pool.map(x=>x.r))];
 const out=[];
 for(let n=0;n<GACHA.cards;n++){
  const need=n===GACHA.cards-1&&!out.some(x=>RORD.indexOf(x.r)>=RORD.indexOf(GACHA.guarantee));
  const rarity=packRarity(rollRarity(need?GACHA.guarantee:null),available);
  const cand=pool.filter(x=>x.r===rarity);
  out.push(Object.assign({},cand[Math.floor(Math.random()*cand.length)]));
 }
 return out;
}

function effCost(c){if(c.t!=='w'||typeof G==='undefined'||!G)return c.c;const o=G.P.find(q=>q.hand.some(h=>h.uid===c.uid));return Math.max(1,c.c-(c.costReduction||0)-(o&&o.units.some(u=>!u.dead&&u.card.wdisc)?1:0));}
function canCast(p,c){
 const un=p.mana.filter(m=>!m.tapped);
 if(un.length<effCost(c)||(c.i!=='ne'&&!un.some(m=>m.card.i===c.i)))return false;
 if(c.t==='w'&&!p.units.length)return false;
 if((c.t==='c'||c.t==='p')&&p.fields.some(f=>f.t===c.t))return false;
 return true;
}
// 戦術(奇襲)の効果に有効な対象があるか(AIが空打ちしないため)
function fxUseful(p,c){
 const d=opp(p);
 return c.e.every(e=>{switch(e.t){
  case 'killAll':return d.units.some(u=>power(u)<=e.max);
  case 'kill':return d.units.some(u=>(!e.max||power(u)<=e.max)&&(!e.tapped||u.tapped));
  case 'bounce':case 'tapSkip':return d.units.length>0;
  case 'tapE':return d.units.some(u=>!u.tapped);
  case 'pumpTemp':return p.units.length>0;
  default:return true;}});
}
// 2.106.16 費えの払い方：横にする兵糧を自分で選べる（選ばなければ今までどおり自動）
const payNeed=c=>c.i==='ne'?effCost(c):Math.max(1,effCost(c));
function autoPayUids(p,c){
 const un=p.mana.filter(m=>!m.tapped);
 if(c.i==='ne')return un.slice(0,effCost(c)).map(m=>m.card.uid); // 汎用札はどの兵糧でも払える
 const f=un.find(m=>m.card.i===c.i);if(!f)return [];
 const rest=un.filter(m=>m!==f).sort((a,b)=>(a.card.i===c.i)-(b.card.i===c.i));
 return [f,...rest.slice(0,Math.max(0,effCost(c)-1))].map(m=>m.card.uid);
}
function payOk(p,c,uids){
 if(!Array.isArray(uids)||uids.length!==payNeed(c)||new Set(uids).size!==uids.length)return false;
 const ms=uids.map(u=>p.mana.find(m=>m.card.uid===u&&!m.tapped));if(ms.some(m=>!m))return false;
 return c.i==='ne'||ms.some(m=>m.card.i===c.i);
}
// 払い方を選ぶ意味があるか（縦の兵糧が費えより多く、思想が混ざっている時だけ）
function payChoice(p,c){const un=p.mana.filter(m=>!m.tapped);return un.length>payNeed(c)&&new Set(un.map(m=>m.card.i)).size>1;}
function payMana(p,c,uids){
 if(!payOk(p,c,uids))uids=autoPayUids(p,c);
 for(const u of uids){const m=p.mana.find(x=>x.card.uid===u&&!x.tapped);if(m)m.tapped=true;}
}

async function applyFx(p,e){
 const d=opp(p);
 switch(e.t){
  case 'draw':draw(p,e.n);break;
  case 'drawLowHand':if(p.hand.length<=3)draw(p,1);break;
  case 'ramp':ramp(p,e.n);break;
  case 'shield':for(let i=0;i<e.n;i++)if(p.deck.length)p.shields.push(p.deck.shift());log(`${p.name}の城門が増えた`);break;
  case 'discard':discardRand(d,e.n);break;
  case 'tapAll':d.units.forEach(u=>u.tapped=true);log('相手の武将がすべて横になった');break;
  case 'tapE':{const c=d.units.filter(u=>!u.tapped);if(c.length){const u=await choose(p,c,'横にする相手の武将を選んでください');u.tapped=true;log(`${u.card.n}を横にした`);}break;}
  case 'killAll':{const c=d.units.filter(u=>power(u)<=e.max);for(const u of c)destroy(u);if(c.length)log(`${c.length}体の武将を破壊した`);break;}
  case 'kill':{const c=d.units.filter(u=>(!e.max||power(u)<=e.max)&&(!e.tapped||u.tapped));if(c.length){const u=await choose(p,c,'破壊する相手の武将を選んでください');destroy(u);}break;}
  case 'bounce':{if(d.units.length){const u=await choose(p,d.units,'手札に戻す相手の武将を選んでください');bounceUnit(u);}break;}
  case 'breakS':await breakShields(null,d,e.n);break;
  case 'drawWeapon':{const ws=p.deck.filter(c=>c.t==='w');if(ws.length){const c=ws[Math.floor(Math.random()*ws.length)];p.deck.splice(p.deck.indexOf(c),1);if(e.discount)c.costReduction=(c.costReduction||0)+e.discount;p.hand.push(c);log(`山札から${c.n}を手札に加えた`);}break;}
  case 'graveDraw':{for(let i=0;i<e.n&&p.grave.length;i++){const c=await chooseCard(p,p.grave,'墓地から手札に戻す札を選んでください',false);p.grave.splice(p.grave.indexOf(c),1);p.hand.push(c);log(`${p.name}は墓地から${c.n}を手札に戻した`);}break;}
  case 'killGuard':{const c=d.units.filter(u=>hasKw(u,'guard'));if(c.length){const u=await choose(p,c,'破壊する守を持つ相手の武将を選んでください');destroy(u);}break;}
  case 'drawIfFewer':if(p.hand.length<d.hand.length){draw(p,1);log('手札が少ないので1枚引いた');}break;
  case 'retWeapon':{const c=p.units.filter(u=>u.weapon);if(c.length){const u=await choose(p,c,'武器を手札に戻す武将を選んでください');p.hand.push(u.weapon);log(`${u.weapon.n}を手札に戻した`);u.weapon=null;}break;}
  case 'toMana':{if(p.hand.length){const c=await chooseCard(p,p.hand,'兵糧に置く札を選んでください',false);p.hand=p.hand.filter(x=>x!==c);p.mana.push({card:c,tapped:false});log(`${p.name}は手札から兵糧を置いた`);}break;}
  case 'pumpTemp':{if(p.units.length){const u=await choose(p,p.units,'強化する味方の武将を選んでください');u.mods.push({pow:e.pow,kw:e.kw,till:G.turnNo});log(`${u.card.n}が一時的に強化された`);}break;}
  case 'peekDiscard':{if(d.hand.length){const c=await chooseCard(p,d.hand,`相手の手札です。捨てさせる札を選んでください`,true);d.hand=d.hand.filter(x=>x!==c);d.grave.push(c);log(`${d.name}の${c.n}を捨てさせた`);}break;}
  case 'tapSkip':{if(d.units.length){const u=await choose(p,d.units,'横にする相手の武将を選んでください');u.tapped=true;u.skipUntap=true;log(`${u.card.n}を横にした(次に縦に戻すのを飛ばす)`);}break;}
 }
 render();
}
async function playCard(p,c,pay){
 if(c.t==='x')recordTactic(p,c,false);
 if(c.t==='p')battleCue('princess',p.idx,c.id);
 else if(c.t==='u')battleCue(c.pr&&c.pr.includes('SSR')?'daimyo':'summon',p.idx,c.id);
 payMana(p,c,pay);p.hand=p.hand.filter(x=>x!==c);
 log(`${p.name}:${c.n}を${c.t==='u'?'召喚':c.t==='w'?'装備':'使用'}`);
 if(c.t==='u'){const u=newUnit(p,c);p.units.push(u);render();for(const e of c.e){if(G.over)return;await applyFx(p,e);}}
 else if(c.t==='w'){
  let cands=p.units;if(p.ai&&p.units.some(u=>!u.weapon))cands=p.units.filter(u=>!u.weapon);
  const u=await choose(p,cands,'武器を装備する味方の武将を選んでください');
  releaseWeapon(u);u.weapon=c;log(`${u.card.n}が${c.n}を装備した`);render();
  for(const e of c.e)await applyFx(p,e);
 }else if(c.t==='x'){

  p.grave.push(c);
 }else{p.fields.push(c);render();for(const e of c.e){if(G.over)return;await applyFx(p,e);}}
 render();
}

async function breakShields(att,d,n){
 const originalMatch=G;
 if(d.shields.length)d.keepExposed=false;
 let refill=false;
 try{
  for(let i=0;i<n;i++){
   if(!d.shields.length||G.over)return;
   const match=G;
   battleCue('gate',d.idx,d.shields[0].id);
   if(!TEST&&!G.auto){await sleep(500);if(G!==match||G.over)return;}
   const c=d.shields.shift();log(`${d.name}の城門が破られた!`);
   if(att&&hasPs(att.owner,'rushDraw')&&hasKw(att,'rush')&&once('rd'+att.owner.idx)){draw(att.owner,1);log('小松姫の効果で1枚引いた');}
   if(hasPs(d,'kasuga')&&once('ks'+d.idx))refill=true;
   if(c.k.includes('ambush')){
    let use;

async function startTurn(i){
 if(G.over)return;
 if(G.tag){
  const side=G.P[i],member=G.tag.members[G.tag.turn];
  G.tag.activeBySide[i]=G.tag.turn;
  side.hand=member.hand;side.deck=member.deck;side.mana=member.mana;
  side.name=member.name;side.ai=member.ai;side.remote=G.pvp&&!member.ai&&G.tag.turn!==0;
 }
 G.cur=i;G.turnNo++;battleCue("turn",i);G.once={};const p=G.P[i],d=G.P[1-i];
 p.mana.forEach(m=>m.tapped=false);
 p.units.forEach(u=>{if(u.skipUntap)u.skipUntap=false;else u.tapped=false;u.sick=false;}); // 影縫い: 次に縦に戻すの1回を飛ばす
 p.charged=false;p.faceAtks=0;
 log(`── 第${G.turnNo}手 ${p.name} ──`);
 if(G.turnNo>1){if(!p.deck.length){win(d,`${p.name}の山札が尽きた`);return;}draw(p,1);}
 for(const c of p.fields.slice()){
  if(c.ps==='drawStart')draw(p,1);
  else if(c.ps==='shieldStart'&&p.deck.length)p.shields.push(p.deck.shift());
  else if(c.ps==='graveStart'&&p.grave.length){const card=p.grave.splice(Math.floor(Math.random()*p.grave.length),1)[0];p.hand.push(card);log(`${p.name}は墓地から${card.n}を手札に戻した`);}
  else if(c.ps==='rampStart'&&(c.rampLeft??c.rampTurns??1)>0){ramp(p,1);if(c.rampTurns)c.rampLeft=(c.rampLeft??c.rampTurns)-1;}
  else if(c.ps==='sap'&&d.hand.length>=4)discardRand(d,1);
  else if(c.ps==='refill'&&p.shields.length<=4&&p.deck.length)p.shields.push(p.deck.shift());
  else if(c.ps==='chacha'&&p.units.some(u=>u.weapon))draw(p,1);
  else if(c.ps==='nene'&&d.hand.length>p.hand.length)draw(p,1);
  else if(c.ps==='drawWhenAhead'&&p.hand.length>d.hand.length)draw(p,1);
  else if(c.ps==='hatsu'&&p.mana.length<d.mana.length)ramp(p,1);
 }
 ui.sel=ui.selU=ui.info=ui.pay=null;render();await sleep(300);
 if(p.ai){ui.busy=true;render();await aiTurn(p);if(!G.over)await endTurn();}
 else if(p.remote){ui.busy=true;render();await remoteTurn(p);if(G&&!G.over)await endTurn();}
 else{ui.busy=false;render();}
}
async function endTurn(){
 if(G.over)return;ui.busy=true;ui.sel=ui.selU=null;
 G.P.forEach(q=>q.units.forEach(u=>{u.mods=u.mods.filter(m=>m.till>G.turnNo);})); // 「手番の終わりまで」の効果を消す
 if(G.tag){
  for(let side=0;side<2;side++){
   const member=G.tag.members[G.tag.activeBySide[side]],field=G.P[side];
   member.hand=field.hand;member.deck=field.deck;member.mana=field.mana;
  }
  G.tag.turn=(G.tag.turn+1)%4;
 }
 render();await startTurn(1-G.cur);
}

async function aiTurn(p){
 const d=opp(p);
 if(p.mana.length<8&&p.hand.length){
  const best=pickChargeCard(p,p.hand);
  p.hand=p.hand.filter(x=>x!==best);p.mana.push({card:best,tapped:false});p.charged=true;battleCue("charge",p.idx);log(`${p.name}は兵糧を蓄えた`);render();await sleep(500);
 }
 for(let n=0;n<10&&!G.over;n++){
  const opts=p.hand.filter(c=>canCast(p,c)&&(c.t!=='x'||fxUseful(p,c)));
  if(!opts.length)break;
  opts.sort((a,b)=>b.c-a.c);
  await playCard(p,opts[0]);await sleep(600);
 }
 for(const u of p.units.slice()){
  if(G.over)return;
  if(u.dead||!canAtkU(u))continue;
  const tg=d.units.filter(x=>x.tapped&&power(x)<power(u)+(u.card.attackUnitBonus||0)).sort((a,b)=>power(b)-power(a));
  let target;
  if(tg.length)target=tg[0];
  else if(!faceOk(u))continue;
  else if(d.shields.length===0||Math.random()<0.85)target='face';
  else continue;
  await attack(u,target);await sleep(700);
 }
}

function readVolume(key){
 try{const v=localStorage.getItem('sengoku_volume_'+key);if(v!==null&&Number.isFinite(+v))return Math.max(0,Math.min(1,+v));}catch(e){}

AUD.level={bgm:readVolume('bgm'),sfx:readVolume('sfx')};
const audioBase={bgm:.16,sfx:.55};
function audInit(){
 if(AUD.ctx||typeof window==='undefined')return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const c=new AC();AUD.ctx=c;
  AUD.master=c.createGain();AUD.master.gain.value=AUD.on?1:0;AUD.master.connect(c.destination);
  AUD.bgm=c.createGain();AUD.bgm.gain.value=audioBase.bgm*AUD.level.bgm;AUD.bgm.connect(AUD.master);
  AUD.sfx=c.createGain();AUD.sfx.gain.value=audioBase.sfx*AUD.level.sfx;AUD.sfx.connect(AUD.master);
  const len=Math.floor(c.sampleRate*1.6),ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}
  for(const bus of [AUD.bgm,AUD.sfx]){
   bus.reverb=c.createConvolver();bus.reverb.buffer=ir;const wet=c.createGain();wet.gain.value=.35;bus.reverb.connect(wet);wet.connect(bus);
  }
 }catch(e){AUD.ctx=null;}
}

const hz=m=>440*Math.pow(2,(m-69)/12);
// 琴のようなはじく音
function tone(t,m,dur,type,vol,dest,rev){

 o.connect(g);g.connect(dest);if(rev)g.connect(dest.reverb);o.start(t);o.stop(t+dur+0.05);
}
function noiseBurst(t,dur,f0,f1,vol,dest){
 const c=AUD.ctx,len=Math.ceil(c.sampleRate*dur),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;
 f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
 const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(dest);s.start(t);
}
function thump(t,f,dur,vol,dest){
 const c=AUD.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';
 o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f*0.35),t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);
}

const BGM_MENU=[[5,-1,4,-1,2,-1,3,-1,2,-1,0,-1,-1,-1,-1,-1],[3,-1,2,-1,0,-1,2,-1,3,-1,4,-1,5,-1,-1,-1],[0,-1,2,3,-1,2,0,-1,-1,-1,3,-1,2,-1,0,-1],[7,-1,5,-1,4,-1,5,-1,4,-1,2,-1,3,-1,-1,-1]];

function bgmStep(step,t){
 const c=AUD.ctx,b=AUD.bgm,battle=AUD.scene==='battle',pos=step%16;
 if(pos===0){bgmBar++;const set=battle?BGM_BATTLE:BGM_MENU;bgmPat=set[Math.floor(Math.random()*set.length)];}
 if(pos===0||pos===8){tone(t,pos===0?38:45,battle?0.9:1.8,'triangle',battle?0.5:0.4,b,false);}
 if(bgmPat){const n=bgmPat[pos];if(n>=0)tone(t,BGM_S[n],battle?0.35:0.9,'triangle',battle?0.5:0.45,b,true);}
 if(!battle&&pos===4&&Math.random()<0.5)tone(t,BGM_S[Math.floor(Math.random()*5)]+12,1.2,'sine',0.2,b,true);
 if(battle){
  if(G&&G.siege&&!G.over&&(pos===3||pos===10||pos===15))thump(t,105,.18,.72,b);
  if(pos%4===0)thump(t,pos===0?95:80,0.25,pos===0?0.9:0.55,b);
  if(pos===6||pos===14)noiseBurst(t,0.08,1800,900,0.18,b);
 }
}

 });

function padVis(e){return e.getClientRects().length>0&&getComputedStyle(e).visibility!=='hidden';}
function padLayer(){const app=document.getElementById('app');return app.querySelector('.bigov')||app.querySelector('.packov')||[...app.querySelectorAll('.ov')].pop()||app;}
function padItems(){const L=padLayer();const els=[...(L.matches('[data-a]')?[L]:[]),...L.querySelectorAll('[data-a],button')];
 return els.filter(e=>!e.disabled&&!e.closest('.ver')&&padVis(e));}
function padKeyOf(e){return (e.dataset.a||e.textContent.slice(0,16))+'|'+(e.dataset.id||'');}
function padCur(it){if(!PAD.key)return null;return (it||padItems()).find(e=>padKeyOf(e)===PAD.key)||null;}
function padDefault(it){
 if(pk&&pk.stage==='reveal')return null; // 札をめくる所はAでめくる
 const q=s=>it.find(e=>e.matches(s));
 return q('[data-a="mb"]')||q('[data-a="tearNow"]')||q('[data-a="multiGo"]')||q('.main')||(screen==='game'?q('.hc.ok')||q('[data-a="end"]'):null)||it.find(e=>!e.classList.contains('backfix'))||it[0]||null;
}
function padShow(e){document.querySelectorAll('.gpf').forEach(x=>{if(x!==e)x.classList.remove('gpf');});if(e&&PAD.on){e.classList.add('gpf');try{e.scrollIntoView({block:'nearest',inline:'nearest'});}catch(_){}}}
function padSet(e){PAD.key=e?padKeyOf(e):null;padShow(e);}
function padRefresh(){if(!PAD||!PAD.on)return;const it=padItems();let c=padCur(it);if(!c&&!(pk&&pk.stage==='reveal'))c=padDefault(it);PAD.key=c?padKeyOf(c):null;padShow(c);}
function padMove(dx,dy){
 const it=padItems();if(!it.length)return;const cur=padCur(it);
 if(!cur){padSet(padDefault(it)||it[0]);return;}
 const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 for(const e of it){if(e===cur)continue;const q=e.getBoundingClientRect(),ex=q.left+q.width/2,ey=q.top+q.height/2;
  const along=dx?(ex-cx)*dx:(ey-cy)*dy,side=dx?Math.abs(ey-cy):Math.abs(ex-cx);
  if(along<=4)continue;const s=along+side*(dx?3:1.5);if(s<bs){bs=s;best=e;}}
 if(best)padSet(best);
}
function padBack(){
 if(screen==='game'&&G&&!pk&&!ui.modal&&!ui.rules&&!G.over&&(ui.sel||ui.selU||ui.info)){ui.sel=null;ui.selU=null;ui.info=null;render();return;}
 const a=backAction();if(a)onClick(a);
}
function padTab(d){
 const L=padLayer();const on=[...L.querySelectorAll('.sc.on[data-a]')].find(e=>L.querySelectorAll(`.sc[data-a="${e.dataset.a}"]`).length>1);if(!on)return;
 const g=[...L.querySelectorAll(`.sc[data-a="${on.dataset.a}"]`)],i=g.indexOf(on),n=g[(i+d+g.length)%g.length];if(n&&n!==on)n.click();
}
function padScroll(v){
 let e=padCur()||padLayer();
 for(;e&&e!==document.body;e=e.parentElement){if(e.scrollHeight>e.clientHeight+2&&/(auto|scroll)/.test(getComputedStyle(e).overflowY)){e.scrollTop+=v;return;}}
 (document.scrollingElement||document.documentElement).scrollTop+=v;
}
function padGet(){
 let ps=[];const grab=n=>{try{return n.getGamepads?[...n.getGamepads()].filter(p=>p&&p.connected!==false):[];}catch(e){return [];}};
 ps=grab(navigator);if(!ps.length&&EMBED){try{ps=grab(window.parent.navigator);}catch(e){}}
 for(const p of ps)if(p.buttons.some(b=>b&&b.pressed)){if(PAD.idx!==p.index){PAD.idx=p.index;PAD.prev=null;}break;}
 return ps.find(p=>p.index===PAD.idx)||ps.find(p=>p.mapping==='standard')||ps[0]||null;
}
function padTick(){
 const gp=padGet();if(!gp)return;
 const btn=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
 if(!PAD.prev){PAD.prev=gp.buttons.map(b=>b.pressed);return;} // 開いた時に押していたボタンは数えない
 const down=i=>btn(i)&&!PAD.prev[i];
 const ax=i=>{const v=gp.axes[i]||0;return Math.abs(v)<0.2?0:v;};
 const lx=ax(0),ly=ax(1),ry=ax(3);
 const nx=(btn(15)?1:0)-(btn(14)?1:0)+(Math.abs(lx)>0.5?Math.sign(lx):0),ny=(btn(13)?1:0)-(btn(12)?1:0)+(Math.abs(ly)>0.5?Math.sign(ly):0);
 const any=gp.buttons.some(b=>b&&b.pressed)||nx||ny||ry;
 if(any&&!PAD.on){PAD.on=true;padRefresh();}
 const now=performance.now();
 if(nx||ny){const d=Math.abs(nx)>=Math.abs(ny)?'x'+Math.sign(nx):'y'+Math.sign(ny);
  if(d!==PAD.dir){PAD.dir=d;PAD.t0=PAD.tl=now;padMove(d[0]==='x'?Math.sign(nx):0,d[0]==='y'?Math.sign(ny):0);}
  else if(now-PAD.t0>380&&now-PAD.tl>130){PAD.tl=now;padMove(d[0]==='x'?Math.sign(nx):0,d[0]==='y'?Math.sign(ny):0);}}
 else PAD.dir='';
 if(down(0)){
  const it=padItems(),cur=padCur(it);
  if(pk&&pk.stage==='reveal'&&(!cur||cur.dataset.a!=='skip'))flingTop();
  else if(cur)cur.click();
  else{const d=padDefault(it);if(d)padSet(d);}
 }
 if(down(1))padBack();
 if(down(3)&&screen==='game'&&!pk){const e=document.querySelector('#app [data-a="end"]');if(e&&!document.querySelector('#app .ov'))e.click();}
 if(down(4))padTab(-1);if(down(5))padTab(1);
 if(down(9)&&screen==='game'&&G&&!G.over&&!ui.modal&&!pk)onClick('menu');
 if(ry)padScroll(ry*Math.abs(ry)*28);
 PAD.prev=gp.buttons.map(b=>b.pressed);
}
if(typeof document!=='undefined'){
 setInterval(padTick,33);
 document.addEventListener('pointerdown',()=>{if(PAD.on){PAD.on=false;padShow(null);}},true);
}
if(EMBED)parentSend({t:'ready'});
if(new URLSearchParams(location.search).has('balanceTest')){
 const originalRender=render;
 window.CARD_TEST={
  starters:STARTERS.map(({id,name})=>({id,name})),
  async run(firstId,secondId,firstPlayer,seed){
   const first=STARTERS.find(s=>s.id===firstId),second=STARTERS.find(s=>s.id===secondId);
   if(!first||!second)throw Error('対戦する家が見つかりません');
   let state=seed>>>0;
   const random=Math.random;
   Math.random=()=>((state=(Math.imul(state,1664525)+1013904223)>>>0)/4294967296);
   this.opponent=second;this.first=firstPlayer;TEST=true;render=()=>{};
   try{
    await startGame(starterDeck(first),true);
    if(!G.over)throw Error('対戦が終わりませんでした');
    return {winner:G.over.winner.idx,turns:G.turnNo};
   }finally{
    Math.random=random;render=originalRender;TEST=false;this.opponent=null;this.first=null;
   }
  }
 };
}
</script>
